<!-- The special "add item" is identified by the name='palm-add-item' attribute, 
	so all clickable elements in the template should have that attribute set. -->
<div name="palm-add-item" class="palm-row last add-item" x-mojo-tap-highlight="momentary"> 
	<div class="palm-row-wrapper">
		<div name="palm-add-item" class="list-item-add-button"></div>
		<div name="palm-add-item" class="title">
		  #{addItemLabel}
		</div>                        
	</div>
</div>
